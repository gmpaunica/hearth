name: Parallel gate

on:
  pull_request:
    branches:
      - app/integration

concurrency:
  group: parallel-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm

      - name: Fetch integration base
        run: git fetch origin app/integration:refs/remotes/origin/app/integration

      - name: Validate reservation and impact declarations
        run: node scripts/parallel/validate-pr.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: All repository tests
        run: npm test

      - name: Changed TypeScript lint
        run: npm run lint:changed -- --base origin/app/integration

      - name: Skill metadata
        run: npm run check:skills

  repository-lint:
    name: informational repository lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci
      - run: npm run lint
